name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: aevyno-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-build-analyze:
    name: Core / Build / Analyze
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, macOS, ARM64, aevyno]
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail

          candidates=(
            "/Applications/Xcode_26.6.app/Contents/Developer"
            "/Applications/Xcode.app/Contents/Developer"
          )

          for candidate in "${candidates[@]}"; do
            [[ -d "$candidate" ]] || continue

            if ! xcode_version="$(DEVELOPER_DIR="$candidate" xcodebuild -version 2>&1)"; then
              echo "Unable to query Xcode at $candidate:"
              printf '%s\n' "$xcode_version"
              continue
            fi

            first_line="${xcode_version%%$'\n'*}"
            if [[ "$first_line" == "Xcode 26.6" ]]; then
              echo "DEVELOPER_DIR=$candidate" >> "$GITHUB_ENV"
              echo "Using $candidate"
              printf '%s\n' "$xcode_version"
              exit 0
            fi
          done

          echo "::error title=Xcode 26.6 unavailable::Expected Xcode 26.6 at /Applications/Xcode_26.6.app or /Applications/Xcode.app."
          find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort
          exit 1

      - name: Print toolchain diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          xcodebuild -version
          swift --version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Test shared Swift package
        run: swift test

      - name: Build tvOS Simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace AEVYNO.xcworkspace \
            -scheme AEVYNOTV \
            -configuration Debug \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/aevyno-tvos-build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS Simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace AEVYNO.xcworkspace \
            -scheme AEVYNOiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/aevyno-ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Analyze tvOS app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace AEVYNO.xcworkspace \
            -scheme AEVYNOTV \
            -configuration Debug \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/aevyno-tvos-analyze" \
            CODE_SIGNING_ALLOWED=NO \
            analyze

      - name: Analyze iOS app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace AEVYNO.xcworkspace \
            -scheme AEVYNOiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/aevyno-ios-analyze" \
            CODE_SIGNING_ALLOWED=NO \
            analyze

      - name: Lint all tracked Swift files
        shell: bash
        run: |
          set -euo pipefail

          swift_files=()
          while IFS= read -r -d '' swift_file; do
            swift_files+=("$swift_file")
          done < <(git ls-files -z '*.swift')

          if (( ${#swift_files[@]} == 0 )); then
            echo "No tracked Swift files to lint."
            exit 0
          fi

          printf 'Linting %s\n' "${swift_files[@]}"
          swift format lint --strict -- "${swift_files[@]}"

  tvos-ui-tests:
    name: tvOS UI Tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, macOS, ARM64, aevyno]
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail

          candidates=(
            "/Applications/Xcode_26.6.app/Contents/Developer"
            "/Applications/Xcode.app/Contents/Developer"
          )

          for candidate in "${candidates[@]}"; do
            [[ -d "$candidate" ]] || continue

            if ! xcode_version="$(DEVELOPER_DIR="$candidate" xcodebuild -version 2>&1)"; then
              echo "Unable to query Xcode at $candidate:"
              printf '%s\n' "$xcode_version"
              continue
            fi

            first_line="${xcode_version%%$'\n'*}"
            if [[ "$first_line" == "Xcode 26.6" ]]; then
              echo "DEVELOPER_DIR=$candidate" >> "$GITHUB_ENV"
              echo "Using $candidate"
              printf '%s\n' "$xcode_version"
              exit 0
            fi
          done

          echo "::error title=Xcode 26.6 unavailable::Expected Xcode 26.6 at /Applications/Xcode_26.6.app or /Applications/Xcode.app."
          find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort
          exit 1

      - name: Discover and boot tvOS Simulator
        shell: bash
        run: |
          set -euo pipefail

          xcrun simctl list runtimes
          xcrun simctl list devices available
          xcodebuild -showdestinations \
            -workspace AEVYNO.xcworkspace \
            -scheme AEVYNOTV

          simulator_record="$(
            xcrun simctl list devices available --json | python3 -c '
          import json
          import sys

          runtime = "com.apple.CoreSimulator.SimRuntime.tvOS-26-5"
          name = "Apple TV 4K (3rd generation)"
          devices = json.load(sys.stdin).get("devices", {}).get(runtime, [])
          match = next(
              (device for device in devices
               if device.get("name") == name and device.get("isAvailable", False)),
              None,
          )
          if match:
              print("{}\t{}".format(match.get("udid", ""), match.get("state", "")))
          '
          )"
          IFS=$'\t' read -r simulator_id simulator_state <<< "$simulator_record"

          if [[ -z "$simulator_id" ]]; then
            echo "::error title=tvOS Simulator unavailable::Apple TV 4K (3rd generation) with tvOS 26.5 is not available."
            exit 1
          fi

          if [[ "$simulator_state" != "Booted" ]]; then
            xcrun simctl boot "$simulator_id"
          fi
          xcrun simctl bootstatus "$simulator_id" -b

      - name: Run tvOS UI tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace AEVYNO.xcworkspace \
            -scheme AEVYNOTV \
            -configuration Debug \
            -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=26.5' \
            -derivedDataPath "$RUNNER_TEMP/aevyno-tvos-ui-tests" \
            CODE_SIGNING_ALLOWED=NO \
            test
